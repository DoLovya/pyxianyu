name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpython:
    name: CPython (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Smoke import
        run: |
          python -c "import pyxianyu; import pyxianyu.apis; import pyxianyu.core; import pyxianyu.utils; import pyxianyu.message"
      - name: Compile
        run: python -m compileall -q src
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  pypy-smoke:
    name: PyPy smoke (pypy3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "pypy3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build and install package
        run: |
          python -m build
          python -m pip install dist/*.whl
      - name: Smoke import
        run: |
          python -c "import platform; import pyxianyu; import pyxianyu.apis; import pyxianyu.core; import pyxianyu.utils; import pyxianyu.message; print(platform.python_implementation(), pyxianyu.__version__)"
      - name: Compile
        run: python -m compileall -q src
      - name: Unit tests
        run: python -m unittest discover -s tests -v
