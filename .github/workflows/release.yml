name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          from __future__ import annotations
          import os
          import re
          import tomllib

          tag = os.environ["TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:[-+].+)?", tag):
              raise SystemExit(f"Tag format invalid: {tag!r}. Expected vX.Y.Z")

          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          if tag.lstrip("v") != version:
              raise SystemExit(f"Version mismatch: tag={tag.lstrip('v')} pyproject={version}")

          print(f"OK: tag={tag} version={version}")
          PY
      - name: Build distributions
        run: |
          python -m build
      - name: Validate distributions
        run: |
          python -m twine check dist/*
      - name: Install wheel and smoke test (end-user mode)
        run: |
          python -m venv /tmp/pyxianyu-smoke
          /tmp/pyxianyu-smoke/bin/pip install --upgrade pip
          /tmp/pyxianyu-smoke/bin/pip install dist/*.whl
          echo "--- full import smoke ---"
          /tmp/pyxianyu-smoke/bin/python -c "
            import pyxianyu
            from pyxianyu import (
                __version__,
                AuthApi, ItemApi, MediaApi, SearchApi, UserApi,
                XianyuClient, XianyuApis, XianyuLive,
            )
            import pyxianyu.apis
            import pyxianyu.core
            import pyxianyu.core.exceptions
            import pyxianyu.utils
            import pyxianyu.message
            import pyxianyu.xianyu_apis
            import pyxianyu.xianyu_live
            expected = '${{ env.TAG }}'.lstrip('v')
            assert __version__ == expected, f'version mismatch: {__version__} vs tag {expected}'
            print('all imports ok, version:', __version__)
          "
          echo "--- compile check installed package ---"
          SITE_PKGS=$(/tmp/pyxianyu-smoke/bin/python -c "import pyxianyu, os; print(os.path.dirname(pyxianyu.__file__))")
          /tmp/pyxianyu-smoke/bin/python -m compileall -q "$SITE_PKGS"
          echo "--- entrypoint / module __all__ check ---"
          /tmp/pyxianyu-smoke/bin/python -c "
            import pyxianyu
            for name in pyxianyu.__all__:
                assert hasattr(pyxianyu, name), f'__all__ mentions {name!r} but missing from package'
            print('__all__ exports:', pyxianyu.__all__)
          "
          echo "wheel install smoke: OK"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
