name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          from __future__ import annotations
          import os
          import re
          import tomllib

          tag = os.environ["TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:[-+].+)?", tag):
              raise SystemExit(f"Tag format invalid: {tag!r}. Expected vX.Y.Z")

          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          if tag.lstrip("v") != version:
              raise SystemExit(f"Version mismatch: tag={tag.lstrip('v')} pyproject={version}")

          print(f"OK: tag={tag} version={version}")
          PY
      - name: Build distributions
        run: |
          python -m build
      - name: Validate distributions
        run: |
          python -m twine check dist/*
      - name: Install wheel and run smoke checks
        run: |
          python -m pip install dist/*.whl
            python -c "import pyxianyu; import pyxianyu.apis; import pyxianyu.core; import pyxianyu.xianyu_apis; print(pyxianyu.__version__)"
          python -m unittest discover -s tests -v
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
