[project]
name = "pyxianyu"
version = "0.1.0"
description = "闲鱼底层 HTTP / WebSocket 能力库"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["xianyu", "xianyu-sdk", "mcp", "websocket", "automation"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "requests>=2.31.0",
  "loguru>=0.7.2",
  "websockets>=12.0",
  "msgpack>=1.0.0",
  "blackboxprotobuf>=1.0.1",
  "typing-extensions>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/DoLovya/pyxianyu"
Repository = "https://github.com/DoLovya/pyxianyu"
Issues = "https://github.com/DoLovya/pyxianyu/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyxianyu"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
