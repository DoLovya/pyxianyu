[project]
name = "pyxianyu"
version = "0.1.0"
description = "闲鱼底层 HTTP / WebSocket 能力库"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31.0",
  "loguru>=0.7.2",
  "websockets>=12.0",
  "msgpack>=1.0.0",
  "blackboxprotobuf>=1.0.1",
  "typing-extensions>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyxianyu"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

